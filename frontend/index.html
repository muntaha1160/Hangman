<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="game-header">
            <h1>Hangman</h1>
            <p>Guess the hidden word one letter at a time.</p>
        </header>

        <section class="game-board">
            <div class="drawing-area">
                <svg class="hangman-drawing" viewBox="0 0 240 280" role="img" aria-label="Hangman drawing">
                    <line class="gallows" x1="20" y1="260" x2="180" y2="260"></line>
                    <line class="gallows" x1="60" y1="260" x2="60" y2="20"></line>
                    <line class="gallows" x1="60" y1="20" x2="170" y2="20"></line>
                    <line class="gallows" x1="170" y1="20" x2="170" y2="52"></line>

                    <circle id="head" class="body-part hidden" cx="170" cy="75" r="23"></circle>
                    <line id="body" class="body-part hidden" x1="170" y1="98" x2="170" y2="160"></line>
                    <line id="left-arm" class="body-part hidden" x1="170" y1="115" x2="138" y2="145"></line>
                    <line id="right-arm" class="body-part hidden" x1="170" y1="115" x2="202" y2="145"></line>
                    <line id="left-leg" class="body-part hidden" x1="170" y1="160" x2="138" y2="205"></line>
                    <line id="right-leg" class="body-part hidden" x1="170" y1="160" x2="202" y2="205"></line>
                </svg>
            </div>

            <div class="play-area">
                <div class="stats">
                    <div class="stat">
                        <span>Lives left</span>
                        <strong id="lives">6</strong>
                    </div>
                    <div class="stat">
                        <span>Wrong guesses</span>
                        <strong id="wrong">0</strong>
                    </div>
                </div>

                <p id="message" class="message" aria-live="polite">Loading game...</p>

                <div id="word" class="word" aria-live="polite"></div>

                <div id="keyboard" class="keyboard" aria-label="Letter keyboard"></div>

                <button id="new-game" class="new-game" type="button">New Game</button>
            </div>
        </section>

        <p class="tip">Tip: You can also press letters on your keyboard.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
